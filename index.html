<title>COME IN OUT OF IT</title>
<style>
:root{--bg:#070605;--paper:#1a1410;--ink:#e8d9c4;--muted:#9a8570;--accent:#c45a3a;--gold:#c4a36a;--line:#2a221c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Palatino,"Times New Roman",serif}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);max-width:42rem;margin:0 auto}
header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
#meter{color:var(--muted);letter-spacing:.08em}
h1{font-weight:400;font-size:1.4rem;color:var(--gold)}
.art{height:6.2rem;margin:0 0 1rem;border:1px solid var(--line);background:radial-gradient(120% 80% at 20% 0%,rgba(196,90,58,.18),transparent 55%),linear-gradient(#1c1612,#0b0908)}
p{font-size:1.06rem;line-height:1.5;margin:0 0 .85rem}
#choices{display:grid;gap:.6rem;margin-top:1.1rem}
a.choice,button.util{display:block;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--accent);padding:.9rem;font:inherit;text-decoration:none;cursor:pointer;touch-action:manipulation}
.row{display:flex;gap:.5rem;margin:1.2rem 0 2rem}
button.util{border-left-color:var(--gold);flex:1;text-align:center;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.end{letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;color:var(--accent)}

const K="harts-v2";
let S={id:"start",f:{},st:{w:0,s:0,a:0,l:0,d:0}};
function blank(){return{id:"start",f:{},st:{w:0,s:0,a:0,l:0,d:0}}}
function meter(){document.getElementById("meter").textContent="unwritten"}
function show(id){
 const p=P[id]; if(!p)return; S.id=id; meter();
 document.getElementById("story").innerHTML=(p.e?'<div class="end">Ending</div>':'')+(p.h?'<h1>'+p.h+'</h1>':'')+p.t.map(x=>"<p>"+x+"</p>").join("");
 const box=document.getElementById("choices"); box.innerHTML="";
 (p.c||[]).forEach(ch=>{
  const a=document.createElement("a"); a.className="choice"; a.href="#"; a.textContent=ch.t;
  const run=e=>{if(e){e.preventDefault();e.stopPropagation()} if(ch.r)S=blank(); show(ch.g); window.scrollTo(0,0)};
  a.addEventListener("click",run); a.addEventListener("touchend",run,{passive:false}); box.appendChild(a);
 });
 try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
}
document.getElementById("saveBtn").onclick=()=>{try{localStorage.setItem(K,JSON.stringify(S));alert("Saved")}catch(e){alert("No save")}};
document.getElementById("loadBtn").onclick=()=>{try{const r=localStorage.getItem(K);if(!r){alert("No save");return}S=Object.assign(blank(),JSON.parse(r));show(S.id)}catch(e){alert("Broken")}};
document.getElementById("restartBtn").onclick=()=>{if(confirm("Restart?")){S=blank();show("start")}};
show("start");
</script>
</body></html>
